    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#315a42" stop-opacity=".16"/>
    </linearGradient>
  </defs>
  <rect width="620" height="430" fill="none"/>
  <g opacity=".88">
