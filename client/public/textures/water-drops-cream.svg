<svg xmlns="http://www.w3.org/2000/svg" width="620" height="430" viewBox="0 0 620 430">
  <defs>
    <filter id="softShadow" x="-45%" y="-45%" width="190%" height="210%">
      <feDropShadow dx="1.5" dy="4" stdDeviation="2.2" flood-color="#244a35" flood-opacity=".18"/>
    </filter>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".18" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset=".62" stop-color="#5d8068" stop-opacity=".075"/>
      <stop offset="1" stop-color="#5d8068" stop-opacity="0"/>
