    </g>
    <g filter="url(#softShadow)" transform="translate(546 70)">
      <rect x="-1" y="0" width="2" height="42" rx="1" fill="url(#trail)"/>
      <ellipse cx="0" cy="41" rx="4.5" ry="6.9" fill="url(#bead)" stroke="url(#edge)" stroke-width=".42"/>
      <ellipse cx="-1.5" cy="37.8" rx="1.3" ry=".74" fill="#fff" opacity=".38"/>
