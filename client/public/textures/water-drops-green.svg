<svg xmlns="http://www.w3.org/2000/svg" width="620" height="430" viewBox="0 0 620 430">
  <defs>
    <filter id="softShadow" x="-45%" y="-45%" width="190%" height="210%">
      <feDropShadow dx="1.5" dy="5" stdDeviation="2.4" flood-color="#000000" flood-opacity=".28"/>
    </filter>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".20" stop-color="#ffffff" stop-opacity=".15"/>
      <stop offset=".65" stop-color="#ffffff" stop-opacity=".055"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bead" cx="35%" cy="26%" r="76%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".52"/>
      <stop offset=".28" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".72" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".12"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".16"/>
    </linearGradient>
  </defs>
  <rect width="620" height="430" fill="none"/>
  <g opacity=".72">
    <g filter="url(#softShadow)" transform="translate(69 76)">
      <rect x="-1.3" y="0" width="2.6" height="62" rx="1.3" fill="url(#trail)"/>
      <ellipse cx="0" cy="60" rx="6" ry="9.5" fill="url(#bead)" stroke="url(#edge)" stroke-width=".5"/>
      <ellipse cx="-2" cy="55.5" rx="1.8" ry="1" fill="#fff" opacity=".46"/>
    </g>
    <g filter="url(#softShadow)" transform="translate(211 298)">
      <rect x="-1.1" y="0" width="2.2" height="48" rx="1.1" fill="url(#trail)"/>
      <ellipse cx="0" cy="47" rx="5" ry="7.8" fill="url(#bead)" stroke="url(#edge)" stroke-width=".45"/>
      <ellipse cx="-1.7" cy="43.3" rx="1.5" ry=".82" fill="#fff" opacity=".42"/>
    </g>
    <g filter="url(#softShadow)" transform="translate(374 112)">
      <rect x="-1.5" y="0" width="3" height="76" rx="1.5" fill="url(#trail)"/>
      <ellipse cx="0" cy="74" rx="7" ry="11" fill="url(#bead)" stroke="url(#edge)" stroke-width=".55"/>
      <ellipse cx="-2.3" cy="68.7" rx="2" ry="1.1" fill="#fff" opacity=".44"/>
    </g>
    <g filter="url(#softShadow)" transform="translate(536 253)">
